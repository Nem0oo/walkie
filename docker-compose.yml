# À copier dans /home/nem0oo/homelab-services/walkie/ (voir README.md pour les
# instructions de déploiement complètes). Suit le pattern des autres services du repo
# homelab-services (Leitner, training, stalwart) : réseau externe reseau_interne,
# watchtower, healthcheck wget.
services:
  walkie:
    image: nem0oo/walkie:latest
    container_name: walkie
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - VIRTUAL_HOST=walkie.gcourtot.fr
      - VIRTUAL_PORT=3000
      - LETSENCRYPT_HOST=walkie.gcourtot.fr
    volumes:
      - ./data:/data
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    labels:
      - com.centurylinklabs.watchtower.enable=true
      # nginx-proxy négocie HTTP/2 par défaut, sur lequel l'Upgrade WebSocket classique
      # (RFC6455) ne fonctionne pas — cette stack n'implémente pas RFC8441 (WebSocket
      # sur HTTP/2). Désactivé ici, scoping au conteneur (lu par nginx-proxy depuis ce
      # label, cf. nginx.tmpl:618) : ne touche pas la config partagée de nginx-proxy ni
      # les autres vhosts.
      - com.github.nginx-proxy.nginx-proxy.http2.enable=false
    networks:
      - frontend

networks:
  frontend:
    name: reseau_interne
    external: true
