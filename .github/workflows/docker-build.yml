name: Walkie Backend CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths-ignore:
      - "ios/**"
      - "**.md"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "ios/**"
      - "**.md"

jobs:
  build_and_push:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Pas de push sur les PR : on valide juste que l'image build, sans
      # publier quoi que ce soit sur Docker Hub.
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: nem0oo/walkie
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  trigger_watchtower:
    # Watchtower on the homelab server only polls Docker Hub once a day
    # (WATCHTOWER_SCHEDULE) — pushing a new image alone doesn't redeploy anything
    # until that runs. Same pattern as killer_search/.github/workflows/build.yml:
    # ping the n8n webhook that forces an immediate watchtower update check instead
    # of waiting for the schedule.
    if: github.event_name == 'push'
    needs: build_and_push
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy via n8n
        run: |
          curl -H "Content-Type: application/json" "https://n8n.gcourtot.fr/webhook/${{ secrets.N8N_WEBHOOK_ID }}"
